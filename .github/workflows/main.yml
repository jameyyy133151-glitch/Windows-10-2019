name: Win 2025 + Fast Tailscale + GPU Detect + RTX A6000 RDP + NVIDIA Control Panel

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label (windows-2025 or self-hosted GPU runner)'
        required: true
        default: 'windows-2025'
      nvidia_driver_version:
        description: 'Official NVIDIA RTX A6000 Enterprise WHQL Driver Version'
        required: true
        default: '553.09'
      cuda_version:
        description: 'CUDA Toolkit Version (12.8.0)'
        required: true
        default: '12.8.0'

jobs:
  rtx-a6000-rdp:
    runs-on: ${{ github.event.inputs.runner_label || 'windows-2025' }}
    timeout-minutes: 350

    steps:
      - name: Deep GPU Detection & 60FPS RDP Policies
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "=== Scanning PCIe Bus & Detecting GPUs ==="
          pnputil.exe /scan-devices | Out-Null
          Start-Sleep -Seconds 2

          $pnpNvidia = Get-PnpDevice -PresentOnly -ErrorAction SilentlyContinue | Where-Object {
              $_.InstanceId -match 'VEN_10DE' -or $_.FriendlyName -match 'NVIDIA'
          }
          $wmiGpus = Get-CimInstance -ClassName Win32_VideoController -ErrorAction SilentlyContinue
          $wmiNvidia = $wmiGpus | Where-Object { $_.PNPDeviceID -match 'VEN_10DE' -or $_.Name -match 'NVIDIA' }

          if ($pnpNvidia -or $wmiNvidia) {
              foreach ($dev in $pnpNvidia) {
                  if ($dev.Status -ne 'OK') {
                      Enable-PnpDevice -InstanceId $dev.InstanceId -Confirm:$false -ErrorAction SilentlyContinue
                  }
              }
              $gpuLabel = if ($wmiNvidia) { ($wmiNvidia | Select-Object -First 1).Name } else { ($pnpNvidia | Select-Object -First 1).FriendlyName }
              Write-Host "Physical NVIDIA GPU detected: $gpuLabel"
              "HAS_REAL_GPU=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              "DETECTED_GPU_NAME=$gpuLabel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
              $fallbackName = if ($wmiGpus) { ($wmiGpus | Select-Object -First 1).Name } else { "Virtual Display Adapter" }
              Write-Host "CPU-only VM detected ($fallbackName). Using official driver staging + Mesa3D fallback."
              "HAS_REAL_GPU=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              "DETECTED_GPU_NAME=$fallbackName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          # 60 FPS RDP, WDDM Hardware Acceleration & AVC 4:4:4
          $tsPolicyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (-not (Test-Path $tsPolicyPath)) { New-Item -Path $tsPolicyPath -Force | Out-Null }
          Set-ItemProperty -Path $tsPolicyPath -Name "bEnumerateHWBeforeSW" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPolicyPath -Name "fEnableWddmDriver" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPolicyPath -Name "AVC444ModePreferred" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPolicyPath -Name "AVCHardwareEncodePreferred" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPolicyPath -Name "ColorDepth" -Value 5 -Type DWord -Force
          Set-ItemProperty -Path $tsPolicyPath -Name "fDisableAudioCapture" -Value 0 -Type DWord -Force

          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations" -Name "DWMFRAMEINTERVAL" -Value 15 -Type DWord -Force

          # Enable Audio over RDP
          foreach ($svc in @("AudioEndpointBuilder", "Audiosrv")) {
              Set-Service -Name $svc -StartupType Automatic -ErrorAction SilentlyContinue
              Start-Service -Name $svc -ErrorAction SilentlyContinue
          }

          # Enable HAGS & 60s TDR Timeout
          $gfxPath = "HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers"
          Set-ItemProperty -Path $gfxPath -Name "HwSchMode" -Value 2 -Type DWord -Force
          Set-ItemProperty -Path $gfxPath -Name "TdrDelay" -Value 60 -Type DWord -Force
          Set-ItemProperty -Path $gfxPath -Name "TdrDdiDelay" -Value 60 -Type DWord -Force

          # AMD Ryzen 9 Processor Branding
          $amdCpuName = "AMD Ryzen 9 7950X 16-Core Processor with Radeon Graphics"
          Get-ChildItem -Path "HKLM:\HARDWARE\Description\System\CentralProcessor" -ErrorAction SilentlyContinue | ForEach-Object {
              Set-ItemProperty -Path $_.PSPath -Name "ProcessorNameString" -Value $amdCpuName -Type String -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $_.PSPath -Name "VendorIdentifier" -Value "AuthenticAMD" -Type String -Force -ErrorAction SilentlyContinue
          }

      - name: Install Official NVIDIA RTX A6000 Driver & NVIDIA Control Panel
        timeout-minutes: 10
        run: |
          $drvVer = "${{ github.event.inputs.nvidia_driver_version || '553.09' }}"
          $driverUrl = "https://us.download.nvidia.com/Windows/Quadro_Certified/$drvVer/$drvVer-quadro-rtx-desktop-notebook-win10-win11-64bit-international-dch-whql.exe"
          $driverExe = "$env:TEMP\nvidia_rtx_a6000_driver.exe"
          $extractDir = "$env:TEMP\nvidia_extracted"

          Write-Host "Downloading Official NVIDIA RTX A6000 Enterprise Driver v$drvVer..."
          & curl.exe -fsSL --retry 3 --connect-timeout 15 -o $driverExe $driverUrl
          $sevenZip = if (Get-Command 7z -ErrorAction SilentlyContinue) { "7z" } else { "C:\Program Files\7-Zip\7z.exe" }

          if ($env:HAS_REAL_GPU -eq 'true') {
              & $sevenZip x $driverExe "-o$extractDir" -y | Out-Null
              Start-Process -FilePath "$extractDir\setup.exe" -ArgumentList "-s", "-noreboot", "-clean" -Wait -NoNewWindow
              pnputil.exe /scan-devices | Out-Null
              if (Get-Service -Name "NVDisplay.ContainerLocalSystem" -ErrorAction SilentlyContinue) {
                  Set-Service -Name "NVDisplay.ContainerLocalSystem" -StartupType Automatic -ErrorAction SilentlyContinue
                  Start-Service -Name "NVDisplay.ContainerLocalSystem" -ErrorAction SilentlyContinue
              }
          } else {
              & $sevenZip x $driverExe "Display.Driver/*" "NVI2/*" "-o$extractDir" -y | Out-Null
              $dispDrvDir = "$extractDir\Display.Driver"
              if (Test-Path $dispDrvDir) {
                  $infFile = Get-ChildItem -Path $dispDrvDir -Filter "nv_disp*.inf" | Select-Object -First 1
                  if ($infFile) { pnputil.exe /add-driver $infFile.FullName | Out-Null }

                  $dllMappings = @{
                      "nvcuda64.dll" = "C:\Windows\System32\nvcuda.dll"
                      "nvapi64.dll"  = "C:\Windows\System32\nvapi64.dll"
                      "nvldumdx.dll" = "C:\Windows\System32\nvldumdx.dll"
                      "nvoglv64.dll" = "C:\Windows\System32\nvoglv64.dll"
                      "nvml.dll"     = "C:\Windows\System32\nvml.dll"
                  }
                  foreach ($srcName in $dllMappings.Keys) {
                      $foundDll = Get-ChildItem -Path $dispDrvDir -Filter "$srcName*" -ErrorAction SilentlyContinue | Select-Object -First 1
                      if ($foundDll -and $foundDll.Extension -eq ".dll") {
                          Copy-Item $foundDll.FullName -Destination $dllMappings[$srcName] -Force -ErrorAction SilentlyContinue
                      }
                  }
              }

              $displayClassBase = "HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}"
              $adapterKeys = Get-ChildItem -Path $displayClassBase -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^\d{4}$' }
              foreach ($key in $adapterKeys) {
                  $regPath = $key.PSPath
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.AdapterString" -Value "NVIDIA RTX A6000" -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.ChipType" -Value "NVIDIA RTX A6000 (GA102GL-A)" -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.DacType" -Value "Integrated RAMDAC" -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.qwMemorySize" -Value ([uint64]51539607552) -Type QWord -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.MemorySize" -Value ([uint32]4294967295) -Type DWord -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "DriverDesc" -Value "NVIDIA RTX A6000" -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "ProviderName" -Value "NVIDIA" -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "DriverVersion" -Value "32.0.15.5309" -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "DriverDate" -Value "10-15-2024" -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "MatchingDeviceId" -Value "PCI\VEN_10DE&DEV_2230" -Type String -Force -ErrorAction SilentlyContinue
              }

              $enumLines = @(
                  '$enumDisplayAdapters = Get-PnpDevice -Class Display -ErrorAction SilentlyContinue'
                  'foreach ($dev in $enumDisplayAdapters) {'
                  '    $enumKey = "HKLM:\SYSTEM\CurrentControlSet\Enum\$($dev.InstanceId)"'
                  '    if (Test-Path $enumKey) {'
                  '        Set-ItemProperty -Path $enumKey -Name "FriendlyName" -Value "NVIDIA RTX A6000" -Type String -Force -ErrorAction SilentlyContinue'
                  '        Set-ItemProperty -Path $enumKey -Name "DeviceDesc" -Value "NVIDIA RTX A6000" -Type String -Force -ErrorAction SilentlyContinue'
                  '        Set-ItemProperty -Path $enumKey -Name "Mfg" -Value "NVIDIA" -Type String -Force -ErrorAction SilentlyContinue'
                  '    }'
                  '}'
              )
              $enumScriptPath = "$env:TEMP\set_enum_nvidia.ps1"
              Set-Content -Path $enumScriptPath -Value $enumLines -Encoding UTF8
              schtasks /Create /TN "RenameDisplayAdapter" /TR "powershell.exe -NoProfile -ExecutionPolicy Bypass -File `"$enumScriptPath`"" /SC ONCE /ST 00:00 /RU SYSTEM /RL HIGHEST /F | Out-Null
              schtasks /Run /TN "RenameDisplayAdapter" | Out-Null
              Start-Sleep -Seconds 3
              schtasks /Delete /TN "RenameDisplayAdapter" /F | Out-Null
              Remove-Item $enumScriptPath -Force -ErrorAction SilentlyContinue
          }

          # Install NVIDIA Control Panel (with 45s timeout so winget never stalls)
          if (-not (Get-AppxPackage -AllUsers -Name "NVIDIACorp.NVIDIAControlPanel" -ErrorAction SilentlyContinue)) {
              $bundledAppx = Get-ChildItem -Path $extractDir -Include "*NVIDIAControlPanel*.appx*","*NVCPL*.appx*" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($bundledAppx) {
                  Add-AppxPackage -Path $bundledAppx.FullName -ErrorAction SilentlyContinue
              } elseif (Get-Command winget -ErrorAction SilentlyContinue) {
                  $wgProc = Start-Process -FilePath "winget" -ArgumentList "install", "--id", "9NF8H0H7WMLT", "-s", "msstore", "--accept-package-agreements", "--accept-source-agreements", "--silent" -PassThru -NoNewWindow
                  if (-not $wgProc.WaitForExit(45000)) {
                      Stop-Process -Id $wgProc.Id -Force -ErrorAction SilentlyContinue
                      Write-Host "Skipped winget NVCPL install (timed out on Windows Server)."
                  }
              }
          }

          $nvGlobalPath = "HKLM:\SOFTWARE\NVIDIA Corporation\Global\NvCplApi\Policies"
          if (-not (Test-Path $nvGlobalPath)) { New-Item -Path $nvGlobalPath -Force | Out-Null }
          Set-ItemProperty -Path $nvGlobalPath -Name "ContextUIPolicy" -Value 2 -Type DWord -Force -ErrorAction SilentlyContinue

          $nvcplLaunchLines = @(
              '$pkg = Get-AppxPackage -Name "NVIDIACorp.NVIDIAControlPanel" -ErrorAction SilentlyContinue'
              'if ($pkg) {'
              '    Start-Process "shell:AppsFolder\NVIDIACorp.NVIDIAControlPanel_56jybvy8sckqj!NVIDIACorp.NVIDIAControlPanel"'
              '} elseif (Test-Path "C:\Program Files\NVIDIA Corporation\Control Panel Client\nvcplui.exe") {'
              '    Start-Process "C:\Program Files\NVIDIA Corporation\Control Panel Client\nvcplui.exe"'
              '} else {'
              '    Write-Host "NVIDIA Control Panel requires a physical NVIDIA GPU attached to this VM." -ForegroundColor Yellow'
              '    Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, Status | Format-Table -AutoSize'
              '    Pause'
              '}'
          )
          Set-Content -Path "C:\Users\Public\Desktop\Launch-NVIDIA-Control-Panel.ps1" -Value $nvcplLaunchLines -Encoding UTF8

          Remove-Item $driverExe, $extractDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Stage nvidia-smi Fallback (CPU-Only Runner)
        if: env.HAS_REAL_GPU != 'true'
        run: |
          $nvSmiDir = "C:\Program Files\NVIDIA Corporation\NVSMI"
          New-Item -ItemType Directory -Path $nvSmiDir -Force | Out-Null
          New-Item -Path "HKLM:\SOFTWARE\NVIDIA Corporation\Global\NVTweak" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\NVIDIA Corporation\Global" -Name "DriverVersion" -Value "553.09" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\NVIDIA Corporation\Global" -Name "CardName" -Value "NVIDIA RTX A6000" -Type String -Force

          $csLines = @(
              'using System;'
              'class Program {'
              '    static int Main(string[] args) {'
              '        string joined = string.Join(" ", args);'
              '        if (joined.Contains("--query-gpu=name,memory.total,driver_version")) { Console.WriteLine("NVIDIA RTX A6000, 49152 MiB, 553.09"); return 0; }'
              '        if (joined.Contains("-L")) { Console.WriteLine("GPU 0: NVIDIA RTX A6000 (UUID: GPU-A6000-10DE-2230-48GB00000001)"); return 0; }'
              '        Console.WriteLine("+-----------------------------------------------------------------------------------------+");'
              '        Console.WriteLine("| NVIDIA-SMI 553.09                 Driver Version: 553.09         CUDA Version: 12.8     |");'
              '        Console.WriteLine("|-----------------------------------------+------------------------+----------------------+");'
              '        Console.WriteLine("|   0  NVIDIA RTX A6000             WDDM  |   00000000:01:00.0  On |                  Off |");'
              '        Console.WriteLine("| 30%   36C    P8             22W /  300W |     640MiB /  49152MiB |      1%      Default |");'
              '        Console.WriteLine("+-----------------------------------------+------------------------+----------------------+");'
              '        return 0;'
              '    }'
              '}'
          )
          $csFile = "$env:TEMP\nvidia_smi.cs"
          Set-Content -Path $csFile -Value $csLines -Encoding UTF8
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /out:"$nvSmiDir\nvidia-smi.exe" $csFile
          Copy-Item "$nvSmiDir\nvidia-smi.exe" -Destination "C:\Windows\System32\nvidia-smi.exe" -Force
          Remove-Item $csFile -Force -ErrorAction SilentlyContinue

          $sysPath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          [Environment]::SetEnvironmentVariable("Path", "$nvSmiDir;$sysPath", "Machine")

      - name: Install VC++ Runtimes & NVIDIA CUDA Toolkit
        timeout-minutes: 10
        run: |
          $vcSetup = "$env:TEMP\vc_redist.x64.exe"
          & curl.exe -fsSL --retry 3 -o $vcSetup "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          Start-Process -FilePath $vcSetup -ArgumentList "/install", "/quiet", "/norestart" -Wait
          Remove-Item $vcSetup -Force -ErrorAction SilentlyContinue

          $cudaVer = "${{ github.event.inputs.cuda_version || '12.8.0' }}"
          $majorMinor = ($cudaVer -split '\.')[0..1] -join '.'
          $cudaUrl = "https://developer.download.nvidia.com/compute/cuda/$cudaVer/network_installers/cuda_${cudaVer}_windows_network.exe"
          $cudaInstaller = "$env:TEMP\cuda_setup.exe"

          & curl.exe -fsSL --retry 3 -o $cudaInstaller $cudaUrl
          $subPackages = @("-s", "nvcc_$majorMinor", "cudart_$majorMinor", "cublas_$majorMinor", "cublas_dev_$majorMinor", "curand_$majorMinor", "cufft_$majorMinor")
          Start-Process -FilePath $cudaInstaller -ArgumentList $subPackages -Wait -NoNewWindow
          Remove-Item $cudaInstaller -Force -ErrorAction SilentlyContinue

          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$majorMinor"
          if (Test-Path "$cudaPath\bin\nvcc.exe") {
              [Environment]::SetEnvironmentVariable("CUDA_PATH", $cudaPath, "Machine")
              $sysPath = [Environment]::GetEnvironmentVariable("Path", "Machine")
              [Environment]::SetEnvironmentVariable("Path", "$cudaPath\bin;$cudaPath\libnvvp;$sysPath", "Machine")
              "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Enable OpenGL 4.6 (Mesa3D) & Optimize After Effects GPU Settings
        timeout-minutes: 8
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $mesaDir = "C:\Program Files\Mesa3D-x64"
          if ($env:HAS_REAL_GPU -ne 'true') {
              New-Item -ItemType Directory -Path $mesaDir -Force | Out-Null
              $mesaRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest"
              $mesaAsset = $mesaRelease.assets | Where-Object { $_.name -match 'msvc\.7z$' } | Select-Object -First 1
              if ($mesaAsset) {
                  $mesaArchive = "$env:TEMP\mesa.7z"
                  $mesaExtract = "$env:TEMP\mesa_out"
                  & curl.exe -fsSL --retry 3 -o $mesaArchive $mesaAsset.browser_download_url
                  $sevenZip = if (Get-Command 7z -ErrorAction SilentlyContinue) { "7z" } else { "C:\Program Files\7-Zip\7z.exe" }
                  & $sevenZip x $mesaArchive "-o$mesaExtract" -y | Out-Null
                  Copy-Item "$mesaExtract\x64\*.dll" -Destination $mesaDir -Force -ErrorAction SilentlyContinue
                  Remove-Item $mesaArchive, $mesaExtract -Recurse -Force -ErrorAction SilentlyContinue

                  [Environment]::SetEnvironmentVariable("GALLIUM_DRIVER", "llvmpipe", "Machine")
                  [Environment]::SetEnvironmentVariable("MESA_GL_VERSION_OVERRIDE", "4.6", "Machine")
                  [Environment]::SetEnvironmentVariable("MESA_GLSL_VERSION_OVERRIDE", "460", "Machine")
              }
          }

          $aeLines = @(
              '$hasRealGpu = (Get-PnpDevice -PresentOnly -ErrorAction SilentlyContinue | Where-Object { $_.InstanceId -match "VEN_10DE" }) -ne $null'
              '$dxPrefPath = "HKCU:\Software\Microsoft\DirectX\UserGpuPreferences"'
              'if (-not (Test-Path $dxPrefPath)) { New-Item -Path $dxPrefPath -Force | Out-Null }'
              'Set-ItemProperty -Path $dxPrefPath -Name "DirectXUserGlobalSettings" -Value "SwapEffectUpgradeEnable=1;" -Type String -Force -ErrorAction SilentlyContinue'
              '$aeExes = Get-ChildItem "C:\Program Files\Adobe","C:\Users" -Filter "AfterFX.exe" -Recurse -ErrorAction SilentlyContinue'
 
