name: win 2025 + tailscale + RTX 3050 Virtual GPU + Download.bat (4-Core 16GB RAM)

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label (Standard/Custom 4-core 16GB runner)'
        required: true
        default: 'windows-2025'

jobs:
  secure-rdp:
    # Runs on Windows Server 2025 runner image
    runs-on: ${{ github.event.inputs.runner_label || 'windows-2025' }}
    timeout-minutes: 350

    steps:
      - name: Trigger Virtual GPU Acceleration & Spoof RTX 3050 (4GB VRAM)
        run: |
          Write-Host "Configuring RDP Graphics Acceleration & Virtual RTX 3050 (4GB VRAM)..."

          # 1. Enable WDDM, DirectX WARP, and GPU Enumeration for RDP Sessions
          $tsPolicyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (-not (Test-Path $tsPolicyPath)) {
              New-Item -Path $tsPolicyPath -Force | Out-Null
          }
          Set-ItemProperty -Path $tsPolicyPath -Name "bEnumerateHWBeforeSW" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPolicyPath -Name "fEnableWddmDriver" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPolicyPath -Name "ColorDepth" -Value 5 -Type DWord -Force

          # 2. Inject NVIDIA GeForce RTX 3050 (4GB VRAM) into Display Class Registry
          $displayClassBase = "HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}"
          $adapterKeys = Get-ChildItem -Path $displayClassBase -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^\d{4}$' }

          $gpuName = "NVIDIA GeForce RTX 3050"
          $vramBytes64 = [uint64]4294967296 # 4 GB in bytes (for 64-bit DxDiag / app checks)
          $vramBytes32 = [uint32]4294967295 # 4 GB cap for 32-bit DWORD checks

          foreach ($key in $adapterKeys) {
              $regPath = $key.PSPath
              try {
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.AdapterString" -Value $gpuName -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.ChipType" -Value $gpuName -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.DacType" -Value "Integrated RAMDAC" -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.qwMemorySize" -Value $vramBytes64 -Type QWord -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.MemorySize" -Value $vramBytes32 -Type DWord -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "DriverDesc" -Value $gpuName -Type String -Force -ErrorAction SilentlyContinue
              }
              catch {
                  Write-Host "Notice: Restricted system key on $($key.PSChildName), applied user-writable GPU metadata."
              }
          }
          Write-Host "✅ Virtual GPU registry profile (NVIDIA GeForce RTX 3050 - 4GB VRAM) applied."

      - name: Verify System Specifications (4-Core CPU, 16GB RAM & GPU Profile)
        run: |
          $osInfo = (Get-CimInstance Win32_OperatingSystem).Caption
          $cpuCores = (Get-CimInstance Win32_Processor | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
          $ramGB = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          
          $regGpuPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}\0000"
          $gpuAdapter = (Get-ItemProperty -Path $regGpuPath -Name "HardwareInformation.AdapterString" -ErrorAction SilentlyContinue)."HardwareInformation.AdapterString"
          $gpuVram = [math]::Round(((Get-ItemProperty -Path $regGpuPath -Name "HardwareInformation.qwMemorySize" -ErrorAction SilentlyContinue)."HardwareInformation.qwMemorySize") / 1GB, 2)

          Write-Host "=========================================="
          Write-Host "Operating System  : $osInfo"
          Write-Host "Logical CPU Cores : $cpuCores"
          Write-Host "Total Physical RAM: $ramGB GB"
          Write-Host "Configured GPU    : $gpuAdapter ($gpuVram GB VRAM)"
          Write-Host "=========================================="

      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove existing rule to prevent duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
         
          # Allow incoming connection on RDP port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
         
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
         
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
         
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with auth key and unique runner hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
         
          # Wait for Tailscale IP assignment
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
         
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
     
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
         
          # Test TCP connectivity against Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection + Watch RDP User
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"

          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {
              if (Test-Path $rdpProfile) {
                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }

                      Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
                      Write-Host "✅ Downloads.bat copied to $downloadPath"

                      # Run batch file
                      cmd /c $downloadPath
                      Write-Host "✅ Downloads.bat executed successfully"
                      break
                  }
                  catch {
                      Write-Host "❌ Error copying or executing Downloads.bat: $($_.Exception.Message)"
                      break
                  }
              }
              else {
                  Write-Host "[$(Get-Date)] Waiting for RDP profile to be created..."
                  Start-Sleep -Seconds 30
              }
          }

          # Keep runner alive
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
          
