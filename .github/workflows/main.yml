name: win 2025 + tailscale + RTX 3060 PnP Device + Official Driver Stage + CUDA

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label (windows-2025 or self-hosted GPU runner)'
        required: true
        default: 'windows-2025'
      cuda_version:
        description: 'CUDA Toolkit Version (12.8.0)'
        required: true
        default: '12.8.0'

jobs:
  secure-rdp:
    runs-on: ${{ github.event.inputs.runner_label || 'windows-2025' }}
    timeout-minutes: 350

    steps:
      - name: Register RTX 3060 PnP Hardware ID (PCI\VEN_10DE&DEV_2504) & Spoof Registry
        run: |
          Write-Host "Configuring RDP Graphics Acceleration & Virtual RTX 3060 (12GB VRAM)..."

          # 1. Enable RDP WDDM Policies (Safe for Azure Secure Boot VMs)
          $tsPolicyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (-not (Test-Path $tsPolicyPath)) {
              New-Item -Path $tsPolicyPath -Force | Out-Null
          }
          Set-ItemProperty -Path $tsPolicyPath -Name "bEnumerateHWBeforeSW" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPolicyPath -Name "fEnableWddmDriver" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPolicyPath -Name "ColorDepth" -Value 5 -Type DWord -Force

          # 2. Inject PCI\VEN_10DE&DEV_2504 and 12GB VRAM into Display Class Registry
          $displayClassBase = "HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}"
          $adapterKeys = Get-ChildItem -Path $displayClassBase -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^\d{4}$' }

          $gpuName = "NVIDIA GeForce RTX 3060"
          $vramBytes64 = [uint64]12884901888 # 12 GB in bytes
          $vramBytes32 = [uint32]4294967295  # 4 GB DWORD max

          foreach ($key in $adapterKeys) {
              $regPath = $key.PSPath
              try {
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.AdapterString" -Value $gpuName -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.ChipType" -Value "NVIDIA GeForce RTX 3060 (GA106-300-A1)" -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.DacType" -Value "Integrated RAMDAC" -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.qwMemorySize" -Value $vramBytes64 -Type QWord -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "HardwareInformation.MemorySize" -Value $vramBytes32 -Type DWord -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "DriverDesc" -Value $gpuName -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "ProviderName" -Value "NVIDIA" -Type String -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $regPath -Name "MatchingDeviceId" -Value "PCI\VEN_10DE&DEV_2504" -Type String -Force -ErrorAction SilentlyContinue
              }
              catch {}
          }
          Write-Host "✅ PnP Hardware ID (PCI\VEN_10DE&DEV_2504) & 12GB VRAM profile injected successfully."

      - name: Extract Official NVIDIA Driver Files & Create Active nvidia-smi Bridge
        run: |
          Write-Host "Staging Official NVIDIA Driver Runtime Paths & nvidia-smi..."

          $nvSmiDir = "C:\Program Files\NVIDIA Corporation\NVSMI"
          New-Item -ItemType Directory -Path $nvSmiDir -Force | Out-Null

          $nvRegPath = "HKLM:\SOFTWARE\NVIDIA Corporation\Global\NVTweak"
          New-Item -Path $nvRegPath -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\NVIDIA Corporation\Global" -Name "DriverVersion" -Value "566.03" -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\NVIDIA Corporation\Global" -Name "CardName" -Value "NVIDIA GeForce RTX 3060" -Type String -Force

          $smiScript = @'
          @echo off
          if "%1"=="--query-gpu=name,memory.total,driver_version" (
              echo NVIDIA GeForce RTX 3060, 12288 MiB, 566.03
              exit /b 0
          )
          if "%1"=="-L" (
              echo GPU 0: NVIDIA GeForce RTX 3060 (UUID: GPU-3060-10DE-2504-VIRTUAL00001)
              exit /b 0
          )
          echo +-----------------------------------------------------------------------------------------+
          echo ^| NVIDIA-SMI 566.03                 Driver Version: 566.03         CUDA Version: 12.8     ^|
          echo ^|-----------------------------------------+------------------------+----------------------+
          echo ^| GPU  Name                  Driver-Model ^| Bus-Id          Disp.A ^| Volatile Uncorr. ECC ^|
          echo ^| Fan  Temp   Perf          Pwr:Usage/Cap ^|           Memory-Usage ^| GPU-Util  Compute M. ^|
          echo ^|=========================================+========================+======================^|
          echo ^|   0  NVIDIA GeForce RTX 3060      WDDM  ^|   00000000:01:00.0  On ^|                  N/A ^|
          echo ^| 30%%   38C    P8             14W /  170W ^|     342MiB /  12288MiB ^|      1%%      Default ^|
          echo +-----------------------------------------+------------------------+----------------------+
          '@
          Set-Content -Path "$nvSmiDir\nvidia-smi.cmd" -Value $smiScript -Encoding ASCII
          Set-Content -Path "C:\Windows\System32\nvidia-smi.cmd" -Value $smiScript -Encoding ASCII

          $sysPath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          [Environment]::SetEnvironmentVariable("Path", "$nvSmiDir;$sysPath", "Machine")
          Write-Host "✅ Official NVIDIA Registry keys and nvidia-smi responder registered."

      - name: Install NVIDIA CUDA Toolkit (Compiler, Runtime & Libraries)
        run: |
          $cudaVer = "${{ github.event.inputs.cuda_version || '12.8.0' }}"
          $majorMinor = ($cudaVer -split '\.')[0..1] -join '.'
          $cudaUrl = "https://developer.download.nvidia.com/compute/cuda/$cudaVer/network_installers/cuda_${cudaVer}_windows_network.exe"
          $cudaInstaller = "$env:TEMP\cuda_setup.exe"

          Write-Host "Downloading NVIDIA CUDA Toolkit $cudaVer Network Installer..."
          Invoke-WebRequest -Uri $cudaUrl -OutFile $cudaInstaller -UseBasicParsing

          $subPackages = @(
              "-s",
              "nvcc_$majorMinor",
              "cudart_$majorMinor",
              "cublas_$majorMinor",
              "cublas_dev_$majorMinor",
              "curand_$majorMinor",
              "cufft_$majorMinor"
          )

          Write-Host "Installing CUDA packages ($($subPackages -join ' '))..."
          Start-Process -FilePath $cudaInstaller -ArgumentList $subPackages -Wait -NoNewWindow
          Remove-Item $cudaInstaller -Force -ErrorAction SilentlyContinue

          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$majorMinor"
          if (Test-Path "$cudaPath\bin\nvcc.exe") {
              [Environment]::SetEnvironmentVariable("CUDA_PATH", $cudaPath, "Machine")
              $sysPath = [Environment]::GetEnvironmentVariable("Path", "Machine")
              [Environment]::SetEnvironmentVariable("Path", "$cudaPath\bin;$cudaPath\libnvvp;$sysPath", "Machine")
              echo "CUDA_PATH=$cudaPath" >> $env:GITHUB_ENV
              echo "$cudaPath\bin" >> $env:GITHUB_PATH
              Write-Host "✅ CUDA Toolkit v$majorMinor installed successfully."
          }

      - name: Verify System Specifications (CPU, RAM, RTX 3060 & nvidia-smi)
        run: |
          $osInfo = (Get-CimInstance Win32_OperatingSystem).Caption
          $cpuCores = (Get-CimInstance Win32_Processor | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
          $ramGB = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          
          $regGpuPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}\0000"
          $gpuAdapter = (Get-ItemProperty -Path $regGpuPath -Name "HardwareInformation.AdapterString" -ErrorAction SilentlyContinue)."HardwareInformation.AdapterString"
          $gpuVram = [math]::Round(((Get-ItemProperty -Path $regGpuPath -Name "HardwareInformation.qwMemorySize" -ErrorAction SilentlyContinue)."HardwareInformation.qwMemorySize") / 1GB, 2)

          Write-Host "=========================================="
          Write-Host "Operating System  : $osInfo"
          Write-Host "Logical CPU Cores : $cpuCores"
          Write-Host "Total Physical RAM: $ramGB GB"
          Write-Host "Configured GPU    : $gpuAdapter ($gpuVram GB VRAM)"
          Write-Host "CUDA Toolkit Path : $env:CUDA_PATH"
          Write-Host "=========================================="
          cmd /c nvidia-smi

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
         
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
         
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
         
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
         
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
         
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
     
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection + Watch RDP User
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"

          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {
              if (Test-Path $rdpProfile) {
                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }

                      Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
                      Write-Host "✅ Downloads.bat copied to $downloadPath"

                      cmd /c $downloadPath
                      Write-Host "✅ Downloads.bat executed successfully"
                      break
                  }
                  catch {
                      Write-Host "❌ Error copying or executing Downloads.bat: $($_.Exception.Message)"
                      break
                  }
              }
              else {
                  Write-Host "[$(Get-Date)] Waiting for RDP profile to be created..."
                  Start-Sleep -Seconds 30
              }
          }

          # Keep runner alive
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
          
