name: Optimized Windows Gaming RDP & Sunshine

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Session duration in minutes (max 350)'
        required: true
        default: '300'
        type: string

jobs:
  gaming-session:
    # Use 'self-hosted' (with a GPU) or your paid GPU runner label.
    # Standard 'windows-2022' / 'windows-2025' runners have NO GPU and cannot run GTA 5.
    runs-on: self-hosted
    timeout-minutes: 350

    steps:
      - name: Verify GPU Hardware & Disk Space
        shell: pwsh
        run: |
          Write-Host "=== Display Adapters ==="
          Get-CimInstance Win32_VideoController | Select-Object Name, AdapterRAM, DriverVersion | Format-Table -AutoSize
          Write-Host "=== Free Disk Space ==="
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{N='FreeGB';E={[math]::Round($_.Free/1GB,2)}} | Format-Table -AutoSize

      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:rdp

      - name: Configure High-FPS RDP & Performance Tweaks
        shell: pwsh
        env:
          RDP_USER: ${{ secrets.RDP_USER }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          # Set High Performance power plan
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c

          # Enable Remote Desktop and firewall rule
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Unlock 60 FPS in RDP (15ms frame interval)
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFRAMEINTERVAL" -Type DWord -Value 15

          # Enable GPU hardware acceleration, WDDM, H.264/AVC 444, and UDP transport for RDP
          $tsPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (!(Test-Path $tsPolicy)) { New-Item -Path $tsPolicy -Force | Out-Null }
          Set-ItemProperty -Path $tsPolicy -Name "bEnumerateHWBeforeSW" -Type DWord -Value 1
          Set-ItemProperty -Path $tsPolicy -Name "AVC444ModePreferred" -Type DWord -Value 1
          Set-ItemProperty -Path $tsPolicy -Name "AVCHardwareEncodePreferred" -Type DWord -Value 1
          Set-ItemProperty -Path $tsPolicy -Name "fEnableWddmDriver" -Type DWord -Value 1
          Set-ItemProperty -Path $tsPolicy -Name "SelectTransport" -Type DWord -Value 0

          # Update password for the specified local Windows account
          if ($env:RDP_USER -and $env:RDP_PASSWORD) {
            net user $env:RDP_USER $env:RDP_PASSWORD
          }

          # Restart Remote Desktop Services to apply 60 FPS & GPU policies
          Restart-Service TermService -Force

      - name: Install GTA 5 Runtimes & Sunshine Stream Host
        shell: pwsh
        run: |
          # Install DirectX and Visual C++ runtimes needed for GTA 5
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            choco install directx vcredist140 -y --no-progress
          }

          # Install latest Sunshine release for low-latency 60 FPS Moonlight streaming
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/LizardByte/Sunshine/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*windows-installer.exe" } | Select-Object -First 1
          if ($asset) {
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:TEMP\sunshine-installer.exe"
            Start-Process -FilePath "$env:TEMP\sunshine-installer.exe" -ArgumentList "/S" -Wait
          }

          # Allow Sunshine ports through Windows Firewall
          New-NetFirewallRule -DisplayName "Sunshine TCP" -Direction Inbound -Protocol TCP -LocalPort 47984,47989,47990,48010 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Sunshine UDP" -Direction Inbound -Protocol UDP -LocalPort 47998-48010 -Action Allow -ErrorAction SilentlyContinue

      - name: Show Connection Details & Keep Session Alive
        shell: pwsh
        run: |
          $tsIP = (tailscale ip -4).Trim()
          Write-Host "========================================="
          Write-Host "Tailscale IP (RDP & Moonlight): $tsIP"
          Write-Host "Sunshine Web UI: https://${tsIP}:47990"
          Write-Host "========================================="

          $minutes = [int]"${{ inputs.session_minutes }}"
          if ($minutes -gt 350) { $minutes = 350 }
          Start-Sleep -Seconds ($minutes * 60)
          
